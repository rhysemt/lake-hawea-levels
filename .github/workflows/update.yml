name: Update data and publish site

on:
  schedule:
    - cron: "15 18 * * *"   # daily, early morning NZ time
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild the full records from scratch"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [site/**, scripts/**, .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Check out the branch tip, not the run's original commit, so that
      # "Re-run" works after an earlier attempt already pushed a data commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Fetch ORC data
        run: python3 scripts/fetch_orc.py ${{ inputs.backfill && '--backfill' || '' }}

      - name: Commit data if changed
        run: |
          git add data/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update lake level data"
          git push

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/*.csv _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Pages deploys occasionally fail with a transient 502; retry once.
      - id: deploy_first
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying deploy
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 60

      - id: deploy_retry
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - id: deploy
        name: Record page URL
        run: echo "page_url=${{ steps.deploy_first.outputs.page_url || steps.deploy_retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
