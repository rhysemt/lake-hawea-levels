name: probe data sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/probe.sh, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/probe.sh
      - name: Push outputs to probe-output branch
        run: |
          cd probe && git init -q -b probe-output && git add -A
          git -c user.name=probe -c user.email=probe@localhost commit -qm "probe ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
