name: probe data sources
on:
  workflow_dispatch:
  push:
    paths: [scripts/probe.sh, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/probe.sh
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: probe/}
